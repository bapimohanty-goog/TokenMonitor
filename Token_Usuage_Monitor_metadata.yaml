# The name of the demo.
title: Token Usuage Monitor


# A short description of the demo.
thumbnail_summary: GCP Token Monitor (TokenMonitor) is a full-stack observability dashboard built to track LLM token consumption and cost on Google Cloud Platform (GCP) across Vertex AI and Gemini workloads. It combines finalized BigQuery billing exports with real-time SDK telemetry in a hybrid ("Lambda") architecture so teams do not have to choose between financial accuracy and live visibility.



# [Optional] A summary of the demo's intention. Markdown supported.
purpose: GCP Token Monitor (TokenMonitor) closes the observability gap between authoritative financial billing and live operational telemetry for Vertex AI and Gemini workloads on GCP. By pairing finalized BigQuery Cloud Billing exports (billing_reconciled) with a real-time telemetry stream (realtime_estimated) from SDK wrappers and Cloud Logging, it eliminates the standard 12–24 hour billing export lag. It also adds granular attribution beyond default GCP billing by extracting user_id and agent_id request labels (defaulting to 'unassigned'), while a configurable REALTIME_CUTOFF_HOURS boundary prevents double-counting between reconciled and live data.


# [Optional] A summary of the demo's business value. Markdown supported.
business_value: For FinOps, engineering leaders, and platform owners, GCP Token Monitor enables proactive cost control, clear accountability, and faster incident response. Live auto-refresh (30s) and minute-level granularity help teams catch runaway agents, prompt loops, or unexpected model spikes immediately rather than waiting for next-day billing exports. Granular attribution across Project, User, Agent, and Model/SKU supports internal chargeback, showback, and unit economics. Meanwhile, combining reconciled invoice costs (including discounts and credits) with live estimates delivers finance-grade accuracy without sacrificing operational speed, and built-in demo mode lowers evaluation friction.


# [Optional] A summary of the demo's technical value. Markdown supported.
technical_value: |
  Technical Value
  Hybrid Lambda Architecture: Combines BigQuery Detailed usage cost billing exports (billing_reconciled) with a day-partitioned streaming table (realtime_llm_telemetry.token_usage_logs, realtime_estimated) fed via a Cloud Logging Sink (token-monitor-realtime-sink).
  
  Double-Counting Prevention: Uses a configurable REALTIME_CUTOFF_HOURS cutoff in client.ts to separate finalized billing windows from live estimates.
  
  Cost-Optimized SQL & Attribution: Leverages _PARTITIONTIME and usage_start_time partition pruning in sql/queries.sql, extracts user_id and agent_id via scalar UNNEST(labels) subqueries, and aggregates live usage with a model_pricing CTE in sql/realtime_telemetry.sql.
  
  SDK Wrappers & Cloud-Native Stack: Provides Python (gemini_telemetry.py) and Node.js (geminiTelemetry.ts) wrappers capturing usageMetadata, backed by React 18, TypeScript, Node.js/Express, ADC, and Cloud Run deployment (DEPLOY_GCP.md).





